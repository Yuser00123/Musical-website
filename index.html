<!DOCTYPE html>
<html>
    <head>
        <title>Musical Website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="container">
            <h1><u><i>Feel the music!</i></u></h1>
            <input id="input">
            <button type="button" id="button" onClick="handle()">PLAY!</button>
            <canvas id="canvas" width="900" height="500"></canvas>
            <b>Color</b>
            <input type="color" id="color" value = #ff0000>
            <b>Volume</b>
            <input type="range" min="1" max="100" value="100" id="volume-slider" class="slider">
            <b>Line thickness</b>
            <input type="range" min="1" max="5" value="2" id="line-width" class="slider">
            <button id="record" onclick="toggle()">Record</button>
        </div>
        <script src="main.js"></script>
    </body>
</html>
